[project]
name = "automate-workflow-py"
version = "0.1.0"
description = "Python/Playwright counterpart to automate-workflow-test"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.5.0",
    "pytest-xdist>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
log_date_format = "%H:%M:%S"
markers = [
    "smoke: Smoke suite — fast sanity checks",
    "sanity: Sanity suite",
    "regression: Regression suite",
    "full: Full suite — long-running connect workflow tests",
    "requires_login: Test requires an authenticated session",
]
